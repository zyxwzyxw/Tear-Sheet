<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Bar Chart Example</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <canvas id="floatingBarChart" width="400" height="200"></canvas>
  <script>
    const ctx = document.getElementById('floatingBarChart').getContext('2d');

    const data = {
      labels: ['January', 'February', 'March', 'April', 'May'],
      datasets: [{
        label: 'Dataset 1',
        data: [
          { x: 'January', y: [5, 10] },
          { x: 'February', y: [2, 6] },
          { x: 'March', y: [8, 12] },
          { x: 'April', y: [4, 7] },
          { x: 'May', y: [6, 9] },
        ],
        backgroundColor: 'rgba(75, 192, 192, 0.5)',
        borderColor: 'rgba(75, 192, 192, 1)',
        borderWidth: 1
      }]
    };

    const options = {
      responsive: true,
      plugins: {
        legend: {
          position: 'top',
        },
        title: {
          display: true,
          text: 'Floating Bar Chart Example'
        }
      },
      scales: {
        x: {
          type: 'category',
          labels: ['January', 'February', 'March', 'April', 'May']
        },
        y: {
          beginAtZero: true
        }
      }
    };

    const floatingBarChart = new Chart(ctx, {
      type: 'bar',
      data: data,
      options: options
    });
  </script>
</body>
</html>
