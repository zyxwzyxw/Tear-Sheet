  <script>

    let updateTable=()=>{}
   
//gear rubicks cube
//ddl ddl dd

//ddl ddl'

let tearSheet=[],combinedEventInfo=[],events=[];

// fetch the data from endpoint
async function fetchFromEndpoint() {
    try {
        const response = await fetch('/db-info');
        const data = await response.json()
        const toexport= data.toexport;
        tearSheet = toexport.tearSheet
        events = toexport.combinedEventInfo
    } catch (error) {
        console.error('Error fetching data:', error);
    }
}

async function main(){
    await fetchFromEndpoint();

    //organize events into combinedEventInfo
    for (let i of events) {
        let team = combinedEventInfo.find(t => t.team_key === i.team_key);

        // If the team object doesn't exist, create a new one
        if (!team) {
            team = {
                team_key: i.team_key,
                events: [],
                seasons:{
                    /*
                    Preseason: 0,
                    Regional: 0,
                    District: 0,
                    Global: 0,
                    Offseason: 0,
                    Total: 0 // Initialize the Total count
                    */
                }
                
            };
            combinedEventInfo.push(team);
        }
        team.events.push(i);
        if(i.event_type.includes(":")) i.event_type=i.event_type.substring(3)
        
        if (!team.seasons[i.frc_season_master_sm_year]) {
            team.seasons[i.frc_season_master_sm_year] = {};
        }

        team.seasons[i.frc_season_master_sm_year][i.event_type] =  team.seasons[i.frc_season_master_sm_year][i.event_type] ?? 0;
        team.seasons[i.frc_season_master_sm_year][i.event_type]++
        team.seasons[i.frc_season_master_sm_year].Total =  team.seasons[i.frc_season_master_sm_year].Total ?? 0;
        team.seasons[i.frc_season_master_sm_year].Total++

    }
    let ageList = {
        rookie: [],
        new: [],
        young: [],
        experienced: [],
        old: [],
    };
    for(let i of tearSheet){
        if(i.age<1) ageList.rookie.push(i.team_key)//rookie
        else if(i.age<4) ageList['new'].push(i.team_key)//2-3 years
        else if(i.age<6) ageList.young.push(i.team_key)//3-5 years
        else if(i.age<11) ageList.experienced.push(i.team_key)//5-10 years
        else ageList.old.push(i.team_key)//11 years and more
    }

    //populating the select element with options
    const dropdown = document.getElementById("teamdropdown")
    
    const select = document.createElement("option")
    dropdown.append(select);
    select.innerHTML = "select";
    
    for(let x of tearSheet) {
        const o = document.createElement("option")
        dropdown.append(o)
        o.value = x.team_key;
        o.innerHTML = x.nickname + " " + x.team_key.substring(3);
    }

    updateTable=()=>{
        document.getElementById("tableName1").innerHTML="Seasonal Summary"
        document.getElementById("tableName2").innerHTML="Each Competition"
        const table = document.getElementById("table");
        while(table.rows[1]) table.deleteRow(1);
        table.style.display = "table";
        
        let i = combinedEventInfo.find((j)=>j.team_key===dropdown.value) 

        for (let j in i.seasons){
            const newRowofTable = document.createElement("tr");
            //const season = i.seasons[j];
            newRowofTable.innerHTML = `<td>${j}</td><td>${i.seasons[j].Preseason??0}</td><td>${i.seasons[j].Regional??0}</td><td>${i.seasons[j].District??0}</td><td>${i.seasons[j].Global??0}</td><td>${i.seasons[j].Offseason??0}</td><td>${i.seasons[j].Total??0}</td>`;

            table.append(newRowofTable);
        }
    
        const competitionTable = document.getElementById("compTable");
        while(competitionTable.rows[1]) competitionTable.deleteRow(1);
        competitionTable.style.display = "table";
        console.log("a")
        for(let j of i.events) {
            const newRowofCompTable = document.createElement("tr");
            newRowofCompTable.innerHTML = `<td>${j.frc_season_master_sm_year}</td><td>${j.event_name}</td><td>${j.rank}</td><td>${j.wins}</td><td>${j.losses}</td><td>${j.ties}</td>`;
            
           // i.frc_season_master_sm_year=

            competitionTable.append(newRowofCompTable);
        }
    }

    console.log(ageList);
    console.log(tearSheet);
    console.log(combinedEventInfo);

    document.getElementById('loading').innerHTML='';
    const boxPlotChart = new Chart(document.getElementById('boxPlotChart').getContext('2d'), {
        type: 'boxplot',
        data: {
            labels: tearSheet.map(i => i.team_key),
            datasets: [{
                label: 'Dataset 1',
                data: combinedEventInfo.map(i => i.events.map(j => j.rank)),
                backgroundColor: 'rgba(75, 192, 192, 0.5)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                title: {
                    display: true,
                    text: 'Box and Whiskers Chart Example'
                }
            }
        }
    });
}
main()


</script>
</body>
