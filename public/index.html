function element(tagName, innerHTML = "", appendTo = document.body, id = null) {
    const element = document.createElement(tagName);
    if (id) element.id = id;

    // Handle innerHTML as an array
    const innerHTMLArray = Array.isArray(innerHTML) ? innerHTML : [innerHTML];

    // Append element
    if (typeof appendTo !== "string") {
        element.innerHTML = innerHTMLArray[0] || "";
        appendTo.appendChild(element);
    } else {
        const elements = document.querySelectorAll(appendTo);
        for (let i = 0; i < elements.length; i++) {
            const newElement = element.cloneNode(true);
            newElement.innerHTML = innerHTMLArray[i] || "";
            newElement.id = id ? id + i : null;
            elements[i].appendChild(newElement);
        }
    }

    return element;
}


let tearSheet=[],combinedEventInfo=[],events=[];
let ageList = {
    rookie: [],
    new: [],
    young: [],
    experienced: [],
    old: [],
}
// fetch the data from endpoint
async function fetchFromEndpoint() {
    try {
        const response = await fetch('/db-info');
        const data = await response.json()
        const toexport= data.toexport;
        tearSheet = toexport.tearSheet
        events = toexport.combinedEventInfo
    } catch (error) {
        console.error('Error fetching data:', error);
    }
}

function ageListTable(){ 
    for(let i of tearSheet){        
        if(i.age<1) ageList.rookie.push(i.team_key)//rookie
        else if(i.age<4) ageList['new'].push(i.team_key)//2-3 years
        else if(i.age<6) ageList.young.push(i.team_key)//3-5 years
        else if(i.age<11) ageList.experienced.push(i.team_key)//5-10 years
        else ageList.old.push(i.team_key)//11 years and more
    }

    let d = element("details");
    element("summary", "Age List", d);

    let table = element("table", "", d);
    let head = element("tr", "", table);
    let c1 = element("th", "Old (10 + years)", head);
    let c2 = element("th", "Experienced (6-10 years)", head);
    let c3 = element("th", "Young (4-5 years)", head);
    let c4 = element("th", "New (2-3 years)", head);
    let c5 = element("th", "Rookie", head);
    
    const categories = ['old', 'experienced', 'young', 'new', 'rookie'];
    const maxLength = Math.max(...categories.map(category => ageList[category].length));

    for (let i = 0; i < maxLength; i++) {
        let tr = element("tr", "", table);
        categories.forEach(category => {
            element("td", ageList[category][i] || "", tr);
        });
    }   
}

async function main(){
    await fetchFromEndpoint();

    ageListTable()
    //organize events into combinedEventInfo
    for (let i of events) {
        let team = combinedEventInfo.find(t => t.team_key === i.team_key);

        // If the team object doesn't exist, create a new one
        if (!team) {
            team = {
                team_key: i.team_key,
                events: [],
                seasons:{
                    /*
                    Preseason: 0,
                    Regional: 0,
                    District: 0,
                    Global: 0,
                    Offseason: 0,
                    Total: 0 // Initialize the Total count
                    */
                }
                
            };
            combinedEventInfo.push(team);
        }
        team.events.push(i);
        if(i.event_type.includes(":")) i.event_type=i.event_type.substring(3)
        
        if (!team.seasons[i.frc_season_master_sm_year]) {
            team.seasons[i.frc_season_master_sm_year] = {};
        }

        team.seasons[i.frc_season_master_sm_year][i.event_type] =  team.seasons[i.frc_season_master_sm_year][i.event_type] ?? 0;
        team.seasons[i.frc_season_master_sm_year][i.event_type]++
        team.seasons[i.frc_season_master_sm_year].Total =  team.seasons[i.frc_season_master_sm_year].Total ?? 0;
        team.seasons[i.frc_season_master_sm_year].Total++

    }

    //console.log(ageList);
   // console.log(tearSheet);

    document.getElementById('loading').innerHTML='';
    
    
    // Helper function to calculate the median
    function calculateMedian(values) {
        values.sort((a, b) => a - b);
        const middleIndex = Math.floor(values.length / 2);
        if (values.length % 2 === 0) {
            return (values[middleIndex - 1] + values[middleIndex]) / 2;
        } else {
            return values[middleIndex];
        }
    }


    function getMedian(i) {
        const ranks = i.events.map(a => a.rank);
        ranks.sort((a, b) => a - b);
        const mid = Math.floor(ranks.length / 2);

        return ranks.length % 2 !== 0 ? ranks[mid] : (ranks[mid - 1] + ranks[mid]) / 2;
    }

    combinedEventInfo.sort((a, b) => getMedian(a) - getMedian(b));


    const boxPlotChart = new Chart(document.getElementById('boxPlotChart').getContext('2d'), {
        type: 'boxplot',
        data: {
            labels: combinedEventInfo.map(i => i.team_key),
            datasets: [{
                label: 'Dataset 1',
                data: combinedEventInfo.map(i => i.events.map(j => j.rank)),
                backgroundColor: 'rgba(75, 192, 192, 0.5)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {

                title: {
                    display: true,
                    text: 'Rankings by Team'
                }
            },
            scales: {
                x: { ticks: { minRotation: 90, }, },
            },
        }
    });
}
